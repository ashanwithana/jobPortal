<div class="login-page-wrapper">
    <!-- Left Panel: Aspirational Branding -->
    <div class="branding-panel">
        <div class="background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
        </div>
        <div class="branding-content">
            <h1 class="branding-quote">Welcome Back.</h1>
            <p class="branding-company">Your next opportunity awaits.</p>
        </div>
    </div>

    <!-- Right Panel: The Login Form -->
    <div class="form-panel">
        <div class="form-card">
            <div class="form-header">
                <h2>Sign In</h2>
                <p>Don't have an account? <a [routerLink]="['/landing']" class="signup-link">Sign Up</a></p>
            </div>
            
            <form>
                <div class="form-field">
                    <input type="email" id="email" name="email" required placeholder=" ">
                    <label for="email">Email Address</label>
                </div>

                <div class="form-field">
                    <input type="password" id="password" name="password" required placeholder=" ">
                    <label for="password">Password</label>
                </div>

                <div class="utility-links">
                    <a [routerLink]="['/forgot-password']" class="forgot-password-link">Forgot Password?</a>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">Log In</button>
                </div>
            </form>
        </div>
    </div>
</div>
