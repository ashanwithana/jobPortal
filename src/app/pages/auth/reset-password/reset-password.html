<div class="reset-password-page-wrapper">
    <!-- Left Panel: Aspirational Branding -->
    <div class="branding-panel">
        <div class="background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
        </div>
        <div class="branding-content">
            <h1 class="branding-quote">Secure Your Account</h1>
            <p class="branding-company">Choose a strong, new password to keep your account safe.</p>
        </div>
    </div>

    <!-- Right Panel: The Reset Form -->
    <div class="form-panel">
        <div class="form-card">
            <div class="form-header">
                <h2>Set a New Password</h2>
                <p>Your new password must be at least 8 characters long.</p>
            </div>
            
            <form>
                <div class="form-field">
                    <input type="password" id="newPassword" name="newPassword" required placeholder=" " minlength="8">
                    <label for="newPassword">New Password</label>
                </div>

                <div class="form-field">
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder=" " minlength="8">
                    <label for="confirmPassword">Confirm New Password</label>
                </div>

                <div class="form-actions">
                    <button type="submit" [routerLink]="['/reset-password']" class="submit-btn">Update Password</button>
                </div>
            </form>

            <div class="utility-links">
                <a href="/login" class="back-to-login-link">
                    <span class="material-icons">arrow_back</span>
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
