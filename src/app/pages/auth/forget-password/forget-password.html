<div class="forgot-password-page-wrapper">
    <!-- Left Panel: Aspirational Branding -->
    <div class="branding-panel">
        <div class="background-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
        </div>
        <div class="branding-content">
            <h1 class="branding-quote">Reset Your Password</h1>
            <p class="branding-company">Let's get you back into your account.</p>
        </div>
    </div>

    <!-- Right Panel: The Reset Form -->
    <div class="form-panel">
        <div class="form-card">
            <div class="form-header">
                <h2>Forgot Password</h2>
                <p>Enter your email address and we'll send you a link to reset your password.</p>
            </div>
            
            <form>
                <div class="form-field">
                    <input type="email" id="email" name="email" required placeholder=" ">
                    <label for="email">Email Address</label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">Send Reset Link</button>
                </div>
            </form>

            <div class="utility-links">
                <a href="/login" class="back-to-login-link">
                    <span class="material-icons">arrow_back</span>
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
