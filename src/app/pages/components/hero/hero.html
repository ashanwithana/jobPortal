<section class="hero-split-container" [class.dark-theme]="themeService.isDarkTheme()">
    <div class="theme-toggle-container">
        <button (click)="toggleAppTheme()" class="theme-toggle-btn" title="Toggle theme">
            <span class="material-icons-outlined icon-light">light_mode</span>
            <span class="material-icons-outlined icon-dark">dark_mode</span>
        </button>
    </div>
</section>
